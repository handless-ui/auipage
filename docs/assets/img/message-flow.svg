<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">一条消息走完的路</title>
  <desc id="desc">用户输入经 AuiPage 交给 ChatTransport Adapter，模型以 SSE 返回片段；需要工具时由 Agent 循环执行并回灌，最终变成 StreamEvent 交给 Runtime 渲染。</desc>

  <defs>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa8bf"/>
    </marker>
    <filter id="fs" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#1b2a44" flood-opacity="0.06"/>
    </filter>
    <pattern id="fg" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e9eef8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="#fbfcff"/>
  <rect width="1200" height="560" fill="url(#fg)" opacity="0.7"/>

  <text x="42" y="50" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6" fill="#8b98ad">AUIPAGE / ONE MESSAGE</text>
  <text x="42" y="94" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">一条消息走完的路</text>
  <text x="42" y="124" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif" font-size="14" fill="#6b7891">从输入到渲染，中间发生了什么；哪些是你的，哪些是 auipage 的。</text>

  <!-- 六个站点 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <!-- 01 -->
    <rect x="42" y="160" width="164" height="140" rx="12" fill="#ffffff" stroke="#dbe3f0" filter="url(#fs)"/>
    <circle cx="66" cy="184" r="12" fill="#eef2f8"/>
    <text x="66" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7891">01</text>
    <text x="88" y="189" font-size="15" font-weight="600" fill="#172033">用户输入</text>
    <text x="62" y="220" font-size="11.5" fill="#7b879c">一句话，一条消息</text>
    <text x="62" y="244" font-size="11.5" fill="#9aa5b8">你的界面负责</text>
    <text x="62" y="268" font-size="11.5" fill="#9aa5b8">输入框 / 回车 / 按钮</text>

    <!-- 02 -->
    <rect x="234" y="160" width="164" height="140" rx="12" fill="#fff9ec" stroke="#e8c56a" filter="url(#fs)"/>
    <circle cx="258" cy="184" r="12" fill="#f7e8bf"/>
    <text x="258" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#a06a00">02</text>
    <text x="280" y="189" font-size="15" font-weight="600" fill="#172033">AuiPage</text>
    <text x="254" y="220" font-size="11.5" fill="#7a6538">组装消息 · 管取消</text>
    <text x="254" y="244" font-size="11.5" fill="#9a8a66">拼片段 · 切换会话</text>
    <text x="254" y="268" font-size="11.5" fill="#9a8a66">调用 Adapter 发起</text>

    <!-- 03 -->
    <rect x="426" y="160" width="164" height="140" rx="12" fill="#f4f7ff" stroke="#b9c9ee" filter="url(#fs)"/>
    <circle cx="450" cy="184" r="12" fill="#e2eaff"/>
    <text x="450" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#2450b0">03</text>
    <text x="472" y="189" font-size="15" font-weight="600" fill="#172033">Adapter</text>
    <text x="446" y="220" font-size="11.5" fill="#526078">ChatTransport.run()</text>
    <text x="446" y="244" font-size="11.5" fill="#7b879c">返回 AsyncGenerator</text>
    <text x="446" y="268" font-size="11.5" fill="#7b879c">放 Agent / SDK / 假流</text>

    <!-- 04 -->
    <rect x="618" y="160" width="164" height="140" rx="12" fill="#ffffff" stroke="#dbe3f0" filter="url(#fs)"/>
    <circle cx="642" cy="184" r="12" fill="#eef2f8"/>
    <text x="642" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7891">04</text>
    <text x="664" y="189" font-size="15" font-weight="600" fill="#172033">模型</text>
    <text x="638" y="220" font-size="11.5" fill="#7b879c">completions + SSE</text>
    <text x="638" y="244" font-size="11.5" fill="#9aa5b8">text / thinking</text>
    <text x="638" y="268" font-size="11.5" fill="#9aa5b8">tool_calls</text>

    <!-- 05 -->
    <rect x="810" y="160" width="164" height="140" rx="12" fill="#f4f7ff" stroke="#b9c9ee" filter="url(#fs)"/>
    <circle cx="834" cy="184" r="12" fill="#e2eaff"/>
    <text x="834" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#2450b0">05</text>
    <text x="856" y="189" font-size="15" font-weight="600" fill="#172033">StreamEvent</text>
    <text x="830" y="220" font-size="11.5" fill="#526078">片段变成事件</text>
    <text x="830" y="244" font-size="11.5" fill="#7b879c">逐条 yield 回来</text>
    <text x="830" y="268" font-size="11.5" fill="#7b879c">前端工具在这里挂起</text>

    <!-- 06 -->
    <rect x="1002" y="160" width="164" height="140" rx="12" fill="#effafb" stroke="#a9dbe1" filter="url(#fs)"/>
    <circle cx="1026" cy="184" r="12" fill="#d7f0f3"/>
    <text x="1026" y="188" text-anchor="middle" font-size="11" font-weight="700" fill="#0b7180">06</text>
    <text x="1048" y="189" font-size="15" font-weight="600" fill="#172033">Runtime</text>
    <text x="1022" y="220" font-size="11.5" fill="#526078">渲染到你的界面</text>
    <text x="1022" y="244" font-size="11.5" fill="#7b879c">React / Vue / DOM</text>
    <text x="1022" y="268" font-size="11.5" fill="#7b879c">同一套逻辑</text>
  </g>

  <!-- 站间箭头 -->
  <g stroke="#9aa8bf" stroke-width="1.4" fill="none">
    <line x1="206" y1="230" x2="226" y2="230" marker-end="url(#fa)"/>
    <line x1="398" y1="230" x2="418" y2="230" marker-end="url(#fa)"/>
    <line x1="590" y1="230" x2="610" y2="230" marker-end="url(#fa)"/>
    <line x1="782" y1="230" x2="802" y2="230" marker-end="url(#fa)"/>
    <line x1="974" y1="230" x2="994" y2="230" marker-end="url(#fa)"/>
  </g>

  <!-- 工具循环 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <path d="M 700 300 L 700 326" stroke="#c8890a" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <rect x="618" y="326" width="356" height="92" rx="12" fill="#fffaf0" stroke="#e8c56a" stroke-dasharray="6 5"/>
    <text x="638" y="354" font-size="13" font-weight="600" fill="#a06a00">Agent 工具循环（可选）</text>
    <text x="638" y="378" font-size="11.5" fill="#7a6538">tool_calls → 执行 → role: "tool" 回灌 → 再请求</text>
    <text x="638" y="400" font-size="11.5" fill="#9a8a66">后端工具直接执行；前端工具经 CreateTool 下发</text>
    <text x="940" y="378" font-size="20" fill="#c8890a">↻</text>
  </g>

  <!-- 历史落库 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <path d="M 316 300 L 316 326" stroke="#3f6fd8" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
    <rect x="234" y="326" width="164" height="52" rx="10" fill="#f4f7ff" stroke="#c9d7f2"/>
    <text x="316" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#2450b0">MessageHistory</text>
    <text x="316" y="366" text-anchor="middle" font-size="10.5" fill="#7b879c">流结束后整组落库</text>
  </g>

  <!-- 可替换标注 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="426" y="326" width="164" height="52" rx="10" fill="#ffffff" stroke="#e1e7f2"/>
    <text x="508" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#526078">可替换</text>
    <text x="508" y="366" text-anchor="middle" font-size="10.5" fill="#9aa5b8">官方 SDK / 假流 / 自己写</text>

    <rect x="1002" y="326" width="164" height="52" rx="10" fill="#ffffff" stroke="#e1e7f2"/>
    <text x="1084" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#526078">可替换</text>
    <text x="1084" y="366" text-anchor="middle" font-size="10.5" fill="#9aa5b8">现成聊天 UI / 自己画</text>
  </g>

  <!-- 底部结论 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <line x1="42" y1="452" x2="1166" y2="452" stroke="#e3e9f3"/>
    <text x="42" y="486" font-size="14" font-weight="600" fill="#172033">AuiPage 只做三件事：收事件、拼片段、落历史。</text>
    <text x="42" y="512" font-size="12" fill="#7b879c">模型、Adapter、Runtime、界面都能换；换哪一段，就只动那一段。</text>
    <text x="1166" y="512" text-anchor="end" font-size="11" fill="#9aa5b8">蓝 = 可替换接缝 · 琥珀 = 流程控制 · 青 = 渲染运行时</text>
  </g>
</svg>
