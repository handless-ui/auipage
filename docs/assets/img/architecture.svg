<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">auipage 的分层与接缝</title>
  <desc id="desc">外部模型与存储经过 Adapter 进入 AuiPage，再经过 Runtime 接到任意界面；AuiPage 不依赖其他包，四个包可以按需加装。</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b9ab2"/>
    </marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f6fd8"/>
    </marker>
    <marker id="ar-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8f9e"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b2a44" flood-opacity="0.06"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e9eef8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="820" fill="#fbfcff"/>
  <rect width="1200" height="820" fill="url(#grid)" opacity="0.7"/>

  <!-- 标题 -->
  <text x="48" y="54" font-family="'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.6" fill="#8b98ad">AUIPAGE / ARCHITECTURE</text>
  <text x="48" y="100" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">三条链路，两个接缝</text>
  <text x="48" y="132" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif" font-size="15" fill="#6b7891">模型、存储、界面都能换；流程控制只写一份。</text>

  <!-- 列标题 -->
  <text x="48" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8b98ad" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">外部世界 · 可换</text>
  <text x="290" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8b98ad" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">ADAPTER · 可换</text>
  <text x="510" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#b47a0a" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">流程控制 · 只一份</text>
  <text x="770" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8b98ad" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">RUNTIME · 可换</text>
  <text x="990" y="196" font-size="12" font-weight="600" letter-spacing="1.2" fill="#8b98ad" font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">你的界面 · 可换</text>

  <!-- 外部世界 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="48" y="220" width="200" height="80" rx="10" fill="#ffffff" stroke="#dbe3f0" filter="url(#soft)"/>
    <text x="148" y="250" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">模型服务</text>
    <text x="148" y="274" text-anchor="middle" font-size="11.5" fill="#7b879c">OpenAI 兼容 / 官方 SDK</text>

    <rect x="48" y="320" width="200" height="80" rx="10" fill="#ffffff" stroke="#dbe3f0" filter="url(#soft)"/>
    <text x="148" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">存储</text>
    <text x="148" y="374" text-anchor="middle" font-size="11.5" fill="#7b879c">数据库 / 内存 / 远端</text>

    <rect x="48" y="420" width="200" height="80" rx="10" fill="#ffffff" stroke="#dbe3f0" filter="url(#soft)"/>
    <text x="148" y="450" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">会话来源</text>
    <text x="148" y="474" text-anchor="middle" font-size="11.5" fill="#7b879c">服务端或浏览器</text>
  </g>

  <!-- Adapter -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="290" y="220" width="180" height="80" rx="10" fill="#f4f7ff" stroke="#b9c9ee" filter="url(#soft)"/>
    <text x="380" y="250" text-anchor="middle" font-size="15" font-weight="600" fill="#2450b0">Chat</text>
    <text x="380" y="274" text-anchor="middle" font-size="11.5" fill="#6b7891">发起一轮对话</text>

    <rect x="290" y="320" width="180" height="80" rx="10" fill="#f4f7ff" stroke="#b9c9ee" filter="url(#soft)"/>
    <text x="380" y="350" text-anchor="middle" font-size="15" font-weight="600" fill="#2450b0">MessageHistory</text>
    <text x="380" y="374" text-anchor="middle" font-size="11.5" fill="#6b7891">消息落库 / 读取</text>

    <rect x="290" y="420" width="180" height="80" rx="10" fill="#f4f7ff" stroke="#b9c9ee" filter="url(#soft)"/>
    <text x="380" y="450" text-anchor="middle" font-size="15" font-weight="600" fill="#2450b0">ThreadList</text>
    <text x="380" y="474" text-anchor="middle" font-size="11.5" fill="#6b7891">会话增删改查</text>
  </g>

  <!-- AuiPage -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="510" y="220" width="220" height="280" rx="16" fill="#fff9ec" stroke="#e8c56a" stroke-width="1.5" filter="url(#soft)"/>
    <text x="620" y="262" text-anchor="middle" font-size="26" font-weight="700" fill="#a06a00">AuiPage</text>
    <text x="620" y="290" text-anchor="middle" font-size="13" fill="#7a6538">发送 · 事件 · 取消 · 历史</text>
    <line x1="538" y1="310" x2="702" y2="310" stroke="#eeddb4"/>

    <rect x="536" y="330" width="74" height="26" rx="13" fill="#ffffff" stroke="#e8c56a"/>
    <text x="573" y="347" text-anchor="middle" font-size="11.5" fill="#8a6414">text</text>
    <rect x="618" y="330" width="82" height="26" rx="13" fill="#ffffff" stroke="#e8c56a"/>
    <text x="659" y="347" text-anchor="middle" font-size="11.5" fill="#8a6414">thinking</text>
        <rect x="536" y="368" width="106" height="26" rx="13" fill="#ffffff" stroke="#e8c56a"/>
    <text x="589" y="385" text-anchor="middle" font-size="11.5" fill="#8a6414">tool-call</text>
    <text x="620" y="430" text-anchor="middle" font-size="12" fill="#7a6538">流程控制只有这一份</text>
    <text x="620" y="454" text-anchor="middle" font-size="12" fill="#a06a00">不依赖其他 auipage 包</text>
    <text x="620" y="480" text-anchor="middle" font-size="10.5" fill="#9a8a66">不依赖 agent / UI 框架</text>
  </g>

  <!-- Runtime -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="770" y="260" width="180" height="90" rx="10" fill="#effafb" stroke="#a9dbe1" filter="url(#soft)"/>
    <text x="860" y="292" text-anchor="middle" font-size="14" font-weight="600" fill="#0b7180">ThreadList</text>
    <text x="860" y="314" text-anchor="middle" font-size="11.5" fill="#6b7891">会话列表状态</text>
    <text x="860" y="334" text-anchor="middle" font-size="11" fill="#8b98ad">Runtime</text>

    <rect x="770" y="370" width="180" height="90" rx="10" fill="#effafb" stroke="#a9dbe1" filter="url(#soft)"/>
    <text x="860" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#0b7180">ChatContent</text>
    <text x="860" y="424" text-anchor="middle" font-size="11.5" fill="#6b7891">消息流式渲染</text>
    <text x="860" y="444" text-anchor="middle" font-size="11" fill="#8b98ad">Runtime</text>
  </g>

  <!-- UI -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="990" y="220" width="160" height="240" rx="12" fill="#ffffff" stroke="#dbe3f0" filter="url(#soft)"/>
    <text x="1070" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#172033">你的界面</text>
    <text x="1070" y="282" text-anchor="middle" font-size="11.5" fill="#7b879c">React / Vue / DOM</text>
    <line x1="1012" y1="300" x2="1128" y2="300" stroke="#e7ecf5"/>
    <text x="1070" y="326" text-anchor="middle" font-size="12" fill="#526078">会话列表</text>
    <text x="1070" y="352" text-anchor="middle" font-size="12" fill="#526078">消息气泡</text>
    <text x="1070" y="378" text-anchor="middle" font-size="12" fill="#526078">工具卡片</text>
    <text x="1070" y="416" text-anchor="middle" font-size="11" fill="#9aa5b8">长什么样，你说了算</text>
  </g>

  <!-- 连接线：外部 → Adapter -->
  <g stroke="#b8c3d6" stroke-width="1.4" fill="none">
    <line x1="248" y1="260" x2="284" y2="260" marker-end="url(#ar)"/>
    <line x1="248" y1="360" x2="284" y2="360" marker-end="url(#ar)"/>
    <line x1="248" y1="460" x2="284" y2="460" marker-end="url(#ar)"/>
  </g>

  <!-- Adapter → AuiPage -->
  <g stroke="#3f6fd8" stroke-width="1.4" fill="none" opacity="0.75">
    <path d="M 470 260 L 500 260 L 500 320 L 504 320" marker-end="url(#ar-blue)"/>
    <line x1="470" y1="360" x2="504" y2="360" marker-end="url(#ar-blue)"/>
    <path d="M 470 460 L 500 460 L 500 400 L 504 400" marker-end="url(#ar-blue)"/>
  </g>

  <!-- AuiPage → Runtime -->
  <g stroke="#0f8f9e" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M 730 320 L 756 320 L 756 305 L 764 305" marker-end="url(#ar-teal)"/>
    <path d="M 730 400 L 756 400 L 756 415 L 764 415" marker-end="url(#ar-teal)"/>
  </g>

  <!-- Runtime → UI -->
  <g stroke="#b8c3d6" stroke-width="1.4" fill="none">
    <line x1="950" y1="305" x2="984" y2="305" marker-end="url(#ar)"/>
    <line x1="950" y1="415" x2="984" y2="415" marker-end="url(#ar)"/>
  </g>

  <!-- 接缝标注 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <line x1="269" y1="210" x2="269" y2="516" stroke="#3f6fd8" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>
    <rect x="196" y="532" width="146" height="28" rx="14" fill="#eef3ff" stroke="#c9d7f2"/>
    <text x="269" y="551" text-anchor="middle" font-size="11.5" fill="#2450b0">接缝 1 · Adapter</text>

    <line x1="968" y1="210" x2="968" y2="516" stroke="#0f8f9e" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.55"/>
    <rect x="895" y="532" width="146" height="28" rx="14" fill="#e9f8f9" stroke="#b7e0e5"/>
    <text x="968" y="551" text-anchor="middle" font-size="11.5" fill="#0b7180">接缝 2 · Runtime</text>
  </g>

  <!-- 底部：按需加装 -->
  <g font-family="'PingFang SC', 'Noto Sans SC', Arial, sans-serif">
    <rect x="48" y="600" width="1104" height="172" rx="16" fill="#ffffff" stroke="#e1e7f2" filter="url(#soft)"/>
    <text x="76" y="638" font-size="17" font-weight="700" fill="#172033">按需加装，不是全家桶</text>
    <text x="76" y="662" font-size="12" fill="#7b879c">下面这条链只是「默认实现」；任意一段都可以拆掉，换成官方 SDK、现成 UI 库，或者你自己写。</text>

    <g font-size="12.5" font-weight="600">
      <rect x="76" y="686" width="92" height="38" rx="8" fill="#f2f5fb" stroke="#d5deee"/>
      <text x="122" y="710" text-anchor="middle" fill="#3d4a61">fetch</text>

      <rect x="208" y="686" width="92" height="38" rx="8" fill="#f2f5fb" stroke="#d5deee"/>
      <text x="254" y="710" text-anchor="middle" fill="#3d4a61">model</text>

      <rect x="340" y="686" width="92" height="38" rx="8" fill="#f2f5fb" stroke="#d5deee"/>
      <text x="386" y="710" text-anchor="middle" fill="#3d4a61">agent</text>

          </g>

    <g stroke="#9aa9c0" stroke-width="1.2" fill="none">
      <line x1="168" y1="705" x2="200" y2="705" marker-end="url(#ar)"/>
      <line x1="300" y1="705" x2="332" y2="705" marker-end="url(#ar)"/>
    </g>

    <g font-size="12" fill="#7b879c">
      <rect x="640" y="686" width="160" height="38" rx="8" fill="#fff9ec" stroke="#e8c56a"/>
      <text x="720" y="710" text-anchor="middle" fill="#a06a00" font-weight="600">core</text>
      <text x="814" y="710" font-size="11.5" fill="#8b98ad">不依赖其他 auipage 包，与 agent 并列</text>
    </g>

    <g font-size="11" fill="#7b879c">
      <circle cx="886" cy="757" r="5" fill="#3f6fd8"/>
      <text x="898" y="761">接缝 / Adapter</text>
      <circle cx="1006" cy="757" r="5" fill="#c8890a"/>
      <text x="1018" y="761">AuiPage / core</text>
      <circle cx="1108" cy="757" r="5" fill="#0f8f9e"/>
      <text x="1120" y="761">Runtime</text>
    </g>
    <text x="76" y="757" font-size="11" fill="#9aa5b8">链上的包都可以换成自己的实现；core 与 agent 并列。</text>
  </g>
</svg>
